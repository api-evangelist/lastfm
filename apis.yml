aid: lastfm
name: Last.fm
description: Last.fm is the long-running music recommendation, scrobbling, and music-data service operated
  by CBS Interactive. Its Web Services 2.0 API (the AudioScrobbler API at ws.audioscrobbler.com/2.0/)
  exposes catalog data (artists, albums, tracks, tags), charts, geo-listening data, user listening history
  (recent tracks, top tracks/albums/artists, weekly charts), and the Scrobbling 2.0 write surface (track.scrobble,
  track.updateNowPlaying, track.love). Every operation is dispatched through a single endpoint via the
  `method` parameter (e.g. `method=user.getRecentTracks`). Authentication uses an API key for reads and
  a signed (`api_sig`) session-key flow for writes. The API is free for non-commercial use; commercial
  use requires a separate agreement via partners@last.fm.
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
